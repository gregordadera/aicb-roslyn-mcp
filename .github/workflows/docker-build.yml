# Builds the Dockerfile and checks that the resulting container actually serves MCP.
#
# Why this exists: the Dockerfile installs the PUBLISHED .NET tool from nuget.org rather
# than building from source, and it deliberately does not pin a version. Nothing else in
# this repository would notice if that stopped working.
#
# ⚠ A RED RUN IS NOT NECESSARILY YOUR COMMIT. Because the install is unpinned, this job
# also fails when nuget.org is unreachable or when a freshly published package is broken.
# That is intentional - it is the only automated smoke test the published package has -
# but read the log before looking for a mistake in the Dockerfile.
#
# Deliberately NOT here: pushing the image anywhere. An image in a registry is a
# distribution channel with its own upkeep, and a stale one is worse than none.

name: Docker image

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - ".github/workflows/docker-build.yml"
  pull_request:
    paths:
      - "Dockerfile"
      - ".github/workflows/docker-build.yml"
  # For running it by hand after publishing a release, when the Dockerfile itself
  # has not changed but the package it installs has.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t aicb:ci .

      # The container executes the MSBuild logic and source generators of whatever solution is
      # mounted into it, so it must not do that as root. Asserted on what `id` reports inside the
      # container rather than on the USER line: a base image change or a reordered Dockerfile can
      # leave the line in place and still end up as root.
      - name: The image does not run as root
        run: |
          uid="$(docker run --rm --entrypoint id aicb:ci -u)"
          docker run --rm --entrypoint id aicb:ci
          if [ -z "$uid" ] || [ "$uid" = "0" ]; then
            echo "FAIL: the container runs as uid '$uid', expected a non-root uid"
            exit 1
          fi
          echo "OK: the container runs as uid $uid."

      # Runs as the image's default non-root user, so a green handshake also shows that the tool
      # under /opt/aicb is readable and executable for that user and that HOME is usable.
      - name: The server starts and answers an MCP handshake
        run: |
          # The three lines a client sends before it can call anything. stdin is held
          # open past the last one on purpose: the server shuts down when stdin closes,
          # and a plain `cat file | docker run` closes it before the answers come back
          # (measured locally - it produced an empty stdout and exit code 0, which is
          # the failure mode this step exists to make impossible).
          {
            printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}'
            printf '%s\n' '{"jsonrpc":"2.0","method":"notifications/initialized"}'
            printf '%s\n' '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}'
            sleep 25
          } | docker run --rm -i aicb:ci > answers.json 2> server.log || true
          # `|| true` because the container's exit code on a closed stdin is not the
          # signal - the answers are. The assertions below are what pass or fail this job.

          echo "--- server log ---"
          cat server.log || true
          echo "--- bytes of stdout ---"
          wc -c < answers.json

          grep -q '"serverInfo"' answers.json \
            || { echo "FAIL: no initialize response - the server did not start or did not reply"; exit 1; }

          tools=$(grep -o '"name":"[a-z_]*"' answers.json | sort -u | wc -l)
          echo "distinct tools advertised: $tools"
          # A floor, not an exact count: the default pool is curated and its size changes
          # between releases. Asserting the exact number would turn every curation wave red.
          [ "$tools" -ge 20 ] \
            || { echo "FAIL: tools/list advertised $tools tools, expected at least 20"; exit 1; }

          echo "OK: the container serves MCP and advertises $tools tools."

      # The invocation the Dockerfile header documents, end to end: a solution owned by the host
      # user, restored in the container into the named package volume, then analyzed by a second
      # container that sees the packages only through that volume. Each half can fail on its own
      # - an unwritable HOME, a volume the non-root user cannot write, an obj/ the container uid
      # may not touch - and every one of them would leave the handshake above green.
      - name: The documented invocation analyzes a solution owned by the host user
        run: |
          host="$(id -u):$(id -g)"
          mkdir probe

          # Created with the image's own SDK and as the host user, so the runner's preinstalled
          # SDKs play no part and every file is owned by the host uid, as in a real checkout.
          # --no-restore: the restore below is the one under test.
          docker run --rm --user "$host" -v "$PWD/probe:/src" --entrypoint sh aicb:ci -c '
            set -e
            echo "uid=$(id -u) HOME=$HOME"
            dotnet new console -o /src/app -n ProbeApp --no-restore
            dotnet new sln -o /src -n Probe --format sln
            dotnet sln /src/Probe.sln add /src/app/ProbeApp.csproj
          '
          cat > probe/app/Greeter.cs <<'CSHARP'
          namespace ProbeApp;

          public sealed class Greeter
          {
              public string Greet(string who) => $"hello {who}";
          }
          CSHARP
          cat > probe/app/Program.cs <<'CSHARP'
          using ProbeApp;

          var greeter = new Greeter();
          System.Console.WriteLine(greeter.Greet("world"));
          CSHARP

          # A fresh named volume must be writable for an arbitrary uid. That depends on Docker
          # initializing it from the image directory's mode, which is asserted here rather than
          # assumed: a failed `touch` names the cause, a failed restore would only hint at it.
          docker run --rm --user "$host" -v aicb-nuget-ci:/home/aicb/.nuget/packages \
            --entrypoint sh aicb:ci -c 'touch "$HOME/.nuget/packages/.write-probe"' \
            || { echo "FAIL: the package volume is not writable for uid $host"; exit 1; }

          # Step 1 of the header, verbatim apart from the names.
          docker run --rm --user "$host" \
            -v "$PWD/probe:/src" -v aicb-nuget-ci:/home/aicb/.nuget/packages \
            --entrypoint dotnet aicb:ci restore /src/Probe.sln

          owner="$(stat -c %u probe/app/obj/project.assets.json)" \
            || { echo "FAIL: the restore wrote no obj/project.assets.json"; exit 1; }
          [ "$owner" = "$(id -u)" ] \
            || { echo "FAIL: project.assets.json belongs to uid $owner, not to the host user $(id -u)"; exit 1; }

          # Step 2 of the header with `aicb call` in place of `aicb mcp`: the same analysis path,
          # minus a JSON-RPC session. Same assertions as the package smoke: an answer at all, and
          # a resolved symbol - `not_found` is a successful run over an empty graph.
          out="$(docker run --rm --user "$host" \
            -v "$PWD/probe:/src" -v aicb-nuget-ci:/home/aicb/.nuget/packages \
            --entrypoint aicb aicb:ci call find_usages --sln /src/Probe.sln --arg symbol=Greeter)"
          echo "$out"

          printf '%s' "$out" | grep -q '"resolvedKind"' \
            || { echo "FAIL: no resolvedKind in the answer - the tool did not answer at all"; exit 1; }
          if printf '%s' "$out" | grep -q '"resolvedKind" *: *"not_found"'; then
            echo "FAIL: Greeter did not resolve - the workspace opened but the symbol graph is empty"
            exit 1
          fi

          echo "OK: as uid $host the container restored and analyzed a solution owned by the host user."
